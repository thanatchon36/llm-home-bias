name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff==0.17.3
      - run: ruff check src tests
      # No GPU or Ollama in CI: rebuild everything from the committed raw replies in data/responses/
      # (prompt set + hash check -> tests -> parse -> estimates -> figures -> tables -> paper numbers).
      - run: make all PY=python
      # The prompt set must hash to the pre-registered value, and every quoted number must be reproduced exactly.
      - run: git diff --exit-code -- prompts/ paper/numbers.tex paper/tables output/tables/*.md output/tables/*.csv

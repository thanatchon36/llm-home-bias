  <g id="text_21">
   <text style="font-size: 6.5px; font-family: 'Source Sans 3'; fill: #59636e" transform="translate(4.608 251.507)">Source: author's experiment; open-weight models run locally with Ollama (4-bit Q4_K_M), 240 factorial prompts per model, greedy decoding.</text>
   <text style="font-size: 6.5px; font-family: 'Source Sans 3'; fill: #59636e" transform="translate(4.608 260.126)">Note: Bars: mean weight on Thailand over the same 240 prompts, ±1.96 s.e. δ: fine-tune minus base, regression with prompt fixed effects, SE clustered by prompt;</text>
   <text style="font-size: 6.5px; font-family: 'Source Sans 3'; fill: #59636e" transform="translate(4.608 268.745)">brackets give the 95% CI.</text>
  </g>

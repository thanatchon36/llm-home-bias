  <g id="text_19">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="53.28" y="17.390437" transform="rotate(-0 53.28 17.390437)">Does Thai fine-tuning shift the allocation towards Thailand?</text>
  </g>
  <g id="text_20">
   <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #59636e" transform="translate(5.328 224.536795)">Source: author's experiment; open-weight models run locally with Ollama (4-bit Q4_K_M), 240 factorial prompts per model, greedy decoding.</text>
   <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; fill: #59636e" transform="translate(5.328 232.338572)">Note: Bars: mean weight on Thailand over the same 240 prompts, ±1.96 s.e. δ: fine-tune minus base, regression with prompt fixed effects, SE clustered by</text>
